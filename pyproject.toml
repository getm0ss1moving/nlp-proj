[project]
name = "coe-lift"
version = "0.1.0"
description = "CoE-LIFT: Chain-of-Embedding aligned cross-lingual OOD reasoning experiments."
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
  "accelerate>=1.6.0,<2.0.0",
  "bitsandbytes>=0.45.0,<0.49.0; platform_system != 'Windows'",
  "datasets>=3.5.0,<5.0.0",
  "deepspeed>=0.15.0,<0.18.0; platform_system != 'Windows'",
  "evaluate>=0.4.3,<0.5.0",
  "hf_transfer>=0.1.8",
  "huggingface_hub>=0.30.0,<1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "peft>=0.15.0,<0.18.0",
  "protobuf>=4.25.0",
  "safetensors>=0.4.5",
  "scikit-learn>=1.4.0,<2.0.0",
  "scipy>=1.12.0,<2.0.0",
  "sentencepiece>=0.2.0",
  "torch==2.5.1",
  "tqdm>=4.66.0,<5.0.0",
  "transformers>=4.51.0,<4.58.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
